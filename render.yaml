databases:
  - name: okanban-db
    databaseName: okanban
    user: okanban

services:
  - type: web
    name: okanban-nginx
    runtime: image
    plan: free
    image:
      url: docker.io/lukevideo/okanban-nginx:latest
    healthCheckPath: /
    envVars:
      - key: NGINX_PORT
        value: 80

  - type: web
    name: okanban-api
    runtime: image
    plan: free
    image:
      url: docker.io/lukevideo/okanban-api:latest
    healthCheckPath: /api/lists
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PORT
        value: 5432
      - key: DEBUG
        value: sequelize:*,okanban:db
