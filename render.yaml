services:
  - type: pserv
    name: okanban-db
    runtime: image
    plan: free
    image:
      url: docker.io/lukevideo/okanban-db:latest
    envVars:
      - key: POSTGRES_USER
        value: okanban
      - key: POSTGRES_DB
        value: okanban
      - key: POSTGRES_PASSWORD
        sync: false

  - type: web
    name: okanban-api
    runtime: image
    plan: free
    image:
      url: docker.io/lukevideo/okanban-api:latest
    healthCheckPath: /api/lists
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: okanban-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: DB_PORT
        value: 5432
      - key: DEBUG
        value: sequelize:*,okanban:db
    startCommand: node index.js

  - type: web
    name: okanban-nginx
    runtime: image
    plan: free
    image:
      url: docker.io/lukevideo/okanban-nginx:latest
    healthCheckPath: /
    envVars:
      - key: NGINX_PORT
        value: 80