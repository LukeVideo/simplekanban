databases:
  - name: okanban-db-managed
    databaseName: okanban
    user: okanban

services:
  - type: web
    name: okanban-api
    runtime: image
    plan: free
    image:
      url: docker.io/lukevideo/okanban-api:latest
    healthCheckPath: /api/lists
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: okanban-db-managed
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: DEBUG
        value: sequelize:*,okanban:db
    startCommand: node index.js

  - type: web
    name: okanban-nginx
    runtime: image
    plan: free
    image:
      url: docker.io/lukevideo/okanban-nginx:latest
    healthCheckPath: /
    envVars:
      - key: NGINX_PORT
        value: 80