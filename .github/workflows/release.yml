name: Build and Push Full Stack

on:
  push:
    branches:
      - release

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Build Vite client
        run: |
          cd client
          npm install
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push okanban-cli
        uses: docker/build-push-action@v4
        with:
          context: ./client
          file: ./client/Dockerfile.cli
          build-args: |
            VITE_API_BASE_URL=/api
          push: true
          tags: lukevideo/okanban-cli:latest

      - name: Build and push okanban-api
        uses: docker/build-push-action@v4
        with:
          context: ./api
          file: ./api/Dockerfile.api
          push: true
          tags: lukevideo/okanban-api:latest