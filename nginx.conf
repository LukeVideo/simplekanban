# Global settings (optional, but good to include)
worker_processes auto;

# Events block (required)
events {
    worker_connections 1024;  # Adjust based on expected traffic
}

http {
    include mime.types;
    default_type application/octet-stream;

    # Define upstream for the API
    upstream api_backend {
        server okanban-api-tnt9.onrender.com:443;
        keepalive 32;  # Improves performance for multiple requests
    }

    server {
        listen 80;
        server_name localhost;

        # Serve static frontend files
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # Proxy health endpoint
        location /health {
            proxy_pass https://api_backend/health;
            proxy_set_header Host okanban-api-tnt9.onrender.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_verify off;  # Avoid SSL issues with Render’s public URL
            proxy_connect_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Proxy API requests
        location /api/ {
            proxy_pass https://api_backend/api/;
            proxy_set_header Host okanban-api-tnt9.onrender.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_verify off;  # Avoid SSL issues
            proxy_connect_timeout 30s;
            proxy_read_timeout 30s;

            # CORS headers for browser compatibility
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, Accept";

            # Handle preflight OPTIONS requests
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "*";
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE";
                add_header Access-Control-Allow-Headers "Content-Type, Authorization, Accept";
                add_header Content-Length 0;
                return 204;
            }
        }
    }
}