events {}

http {
  include mime.types;

  upstream api_backend {
    server okanban-api-tnt9.onrender.com:443 max_fails=5 fail_timeout=20s;
  }

  server {
    listen 80;
    server_name localhost;

    location /health {
      proxy_pass https://api_backend/health;
      proxy_set_header Host okanban-api-tnt9.onrender.com;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_ssl on;
      proxy_ssl_server_name on;
      add_header Access-Control-Allow-Origin "*";
      add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE";
      add_header Access-Control-Allow-Headers "Content-Type, Authorization, Accept";
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
    }

    location /api/ {
      proxy_pass https://api_backend/api/;
      proxy_set_header Host okanban-api-tnt9.onrender.com;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_ssl on;
      proxy_ssl_server_name on;
      proxy_connect_timeout 30s;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
      add_header Access-Control-Allow-Origin "*";
      add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE";
      add_header Access-Control-Allow-Headers "Content-Type, Authorization, Accept";

      if ($request_method = 'OPTIONS') {
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, Accept";
        add_header Content-Length 0;
        return 204;
      }
    }
  }
}