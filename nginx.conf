worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # Hardcode the API upstream
    upstream api_backend {
        server okanban-api-tnt9.onrender.com:443;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Serve frontend files
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # Proxy API requests
        location /api/ {
            proxy_pass https://api_backend/api/;
            proxy_set_header Host okanban-api-tnt9.onrender.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_verify off; # Skip SSL verification for simplicity
            proxy_connect_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
}