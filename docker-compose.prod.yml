version: '3.8'
services:
  nginx:
    image: nginx:latest
    ports:
      - 80:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./client/dist:/usr/share/nginx/html:ro
    environment:
      - NGINX_PORT=80
    networks:
      - okanban-network

  api:
    image: lukevideo/okanban-api:latest
    ports:
      - 5000:3000
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT}
      - NODE_ENV=${NODE_ENV}
      - DEBUG=${DEBUG}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - okanban-network

  client:
    image: lukevideo/okanban-cli:latest
    build:
      context: ./client
      dockerfile: Dockerfile.cli
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    environment:
      - VITE_API_BASE_URL=/api
    networks:
      - okanban-network

  db:
    image: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./api/data:/docker-entrypoint-initdb.d
      - pg-okanban:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - okanban-network

networks:
  okanban-network:
    driver: bridge

volumes:
  pg-okanban: