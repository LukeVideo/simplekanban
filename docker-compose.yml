services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.api
    ports:
      - 3000:3000
    depends_on:
      db:
        condition: service_healthy # Ensure db is ready
    container_name: okanban-api
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT}
      - NODE_ENV=${NODE_ENV}
      - DEBUG=${DEBUG}
    networks:
      - okanban-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.cli
      args:
        - VITE_API_BASE_URL=http://host.docker.internal:3000/api
    ports:
      - 4173:4173
    depends_on:
      - api
    container_name: okanban-cli
    networks:
      - okanban-network
  db:
    image: postgres
    container_name: okanban-database
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./api/data:/docker-entrypoint-initdb.d
      - pg-okanban:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - okanban-network

networks:
  okanban-network:
    driver: bridge

volumes:
  pg-okanban: